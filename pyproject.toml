[project]
name = "sdoc"
version = "0.1.0"
description = "SDOC: shipping-document inbox triage and SI/BL discrepancy detection"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]
aws = ["boto3>=1.34", "mangum>=0.17"]      # Lambda + DynamoDB + Bedrock
dev = ["pytest>=8", "httpx>=0.27", "moto[dynamodb]>=5.0", "mangum>=0.17", "boto3>=1.34"]

[project.scripts]
sdoc = "sdoc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
