<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="SDOC logo: an envelope riding a wave">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285F4"/><stop offset="1" stop-color="#5B4BD6"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34A853"/><stop offset="1" stop-color="#4285F4"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1F1B3A" flood-opacity=".25"/></filter>
  </defs>
  <!-- envelope -->
  <g filter="url(#sh)">
    <rect x="18" y="16" width="60" height="42" rx="8" fill="#FFFFFF" stroke="#E6E2F5" stroke-width="2"/>
    <path d="M22 24 L48 44 L74 24" fill="none" stroke="#EA4335" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="70" cy="22" r="8" fill="#FBBC04"/>
    <path d="M66 22 l3 3 l6 -6" fill="none" stroke="#3A2A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- hull -->
  <path d="M14 60 H82 L72 76 H24 Z" fill="url(#hull)" filter="url(#sh)"/>
  <!-- wave -->
  <path d="M6 82 q10 -8 20 0 t20 0 t20 0 t20 0 t10 0" fill="none" stroke="url(#wave)" stroke-width="6" stroke-linecap="round"/>
</svg>
